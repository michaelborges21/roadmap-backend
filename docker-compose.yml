services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: roadmap
      POSTGRES_PASSWORD: roadmap
      POSTGRES_DB: roadmap
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap"]
      interval: 5s
      retries: 10

  # Porta 11435 no host: o Ollama do systemd já ocupa a 11434.
  ollama:
    image: ollama/ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Busca na web para a pesquisa de fatos sobre o livro (ex.: número de páginas). Sem chave de API.
  searxng:
    image: searxng/searxng
    ports:
      - "8888:8080"
    volumes:
      # Só o arquivo, somente leitura. Montando a pasta, o contêiner a passa para o uid 977 e o
      # usuário do host deixa de conseguir sobrescrever settings.yml — o que quebra checkout e merge.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  pgdata:
  ollama:
