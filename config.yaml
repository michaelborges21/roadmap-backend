extracao:
  # Caractere com corpo acima disso é marca d'água ("Amostra" em Helvetica 80–117pt).
  watermark_min_size: 40
  # Janela do sumário termina após N linhas seguidas sem número de página.
  linhas_sem_pagina_fim: 5
  # PDF com nº de páginas >= fração × paginas_conteudo é livro completo → 422 (spec 2.1).
  livro_completo_fracao: 0.5
  # Ruído: mesma linha (números normalizados) em >= N páginas...
  ruido_min_paginas: 3
  # ...considerando só as N primeiras/últimas linhas de cada página.
  ruido_linhas_borda: 4
  # Sem âncora: texto com >= N linhas longas sem número de página é corpo de livro.
  # Sumário sem paginação: linha terminada em ponto com >= N caracteres encerra a lista.
  paragrafo_min_chars: 60
  paragrafos_min: 10

# Calibração (checkpoint 3): valores iniciais da spec 2.7–2.8.
calculo:
  min_pagina: {leve: 2.0, media: 2.5, densa: 3.0}
  f_senior: {Junior: 1.3, Pleno: 1.0, Senior: 0.7}
  ratio_codigo: {teorico: 0.0, hibrido: 0.4, pratico: 0.8}
  ratio_escrita: 0.15
  fator_gap: 1.3
  fator_baixo_nivel: 1.3
  baixo_nivel: ["c", "c++", "rust", "assembly", "zig"]
  horas_por_sessao: 2

llm:
  # Checkpoint 1 (2026-09-14): Gemma 4 12B classifica, lê capa, explica e escolhe a fonte na
  # pesquisa — um modelo só na VRAM de 12GB. qwen2.5vl:7b foi testado antes e falhou: 99s e
  # resposta fora do schema num sumário de 27 capítulos. Vazio → API responde 503.
  modelo_classificador: gemma4:12b
  modelo_visao: gemma4:12b
  # Multilíngue (sumários e páginas web em português), 768 dim, 2048 tokens.
  modelo_embedding: embeddinggemma
  temperature: 0
  # Defaults do Ollama são armadilha: num_ctx automático pode ser menor que o prompt,
  # e sem num_predict/timeout a requisição pode nunca voltar.
  num_ctx: 16384
  num_predict: 4096
  timeout_s: 180

# Pesquisa de fatos na web (spec 2.9, ADR 0004). Operacional, não é calibração de horas.
pesquisa:
  # Resultados do SearXNG considerados (o snippet de cada um já é fonte).
  resultados_web: 10
  # Desses, quantas páginas são baixadas por inteiro (editora e livrarias costumam vir primeiro).
  paginas_baixadas: 5
  timeout_s: 20
  # Trechos recuperados da base RAG e entregues ao modelo.
  trechos_consulta: 8
  # Caracteres guardados antes e depois de "páginas": ficha técnica cabe, corpo de livro não.
  janela_antes: 150
  janela_depois: 80
  # Prompts de recuperação do embeddinggemma (documento × consulta).
  prefixo_documento: "title: none | text: "
  prefixo_consulta: "task: search result | query: "
