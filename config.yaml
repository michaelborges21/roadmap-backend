extracao:
  # Caractere com corpo acima disso é marca d'água ("Amostra" em Helvetica 80–117pt).
  watermark_min_size: 40
  # Janela do sumário termina após N linhas seguidas sem número de página.
  linhas_sem_pagina_fim: 5
  # PDF com nº de páginas >= fração × paginas_conteudo é livro completo → 422 (spec 2.1).
  livro_completo_fracao: 0.5
  # Ruído: mesma linha (números normalizados) em >= N páginas...
  ruido_min_paginas: 3
  # ...considerando só as N primeiras/últimas linhas de cada página.
  ruido_linhas_borda: 4
  # Sem âncora: texto com >= N linhas longas sem número de página é corpo de livro.
  paragrafo_min_chars: 60
  paragrafos_min: 10

# Calibração (checkpoint 3): valores iniciais da spec 2.7–2.8.
calculo:
  min_pagina: {leve: 2.0, media: 2.5, densa: 3.0}
  f_senior: {Junior: 1.3, Pleno: 1.0, Senior: 0.7}
  ratio_codigo: {teorico: 0.0, hibrido: 0.4, pratico: 0.8}
  ratio_escrita: 0.15
  fator_gap: 1.3
  fator_baixo_nivel: 1.3
  baixo_nivel: ["c", "c++", "rust", "assembly", "zig"]
  horas_por_sessao: 2

llm:
  # Checkpoint 1 (2026-09-14): Gemma 4 12B nos dois papéis — um modelo só na VRAM de 12GB.
  # qwen2.5vl:7b foi testado antes e falhou: 99s e resposta fora do schema no Richards.
  # Vazio → API responde 503.
  modelo_classificador: gemma4:12b
  modelo_visao: gemma4:12b
  # Multilíngue (sumários em português), 768 dim, 2048 tokens (maior chunk medido: ~580).
  modelo_embedding: embeddinggemma
  temperature: 0
  # Defaults do Ollama são armadilha: num_ctx automático pode ser menor que um sumário real,
  # e sem num_predict/timeout a requisição pode nunca voltar.
  num_ctx: 16384
  num_predict: 4096
  timeout_s: 180

rag:
  # Experimental (spec 4): só vai a true se a medição contra a baseline mostrar ganho.
  ativo: false
  # Prompt de similaridade simétrica do embeddinggemma (capítulo × capítulo).
  prefixo: "task: sentence similarity | query: "
  referencias_por_capitulo: 2
  # Checkpoint 3 (2026-09-14): abaixo disso a referência não entra no prompt. Medido no golden
  # set: melhor vizinho entre livros vai de 0,67 a 0,84 (mediana 0,73 = assunto só vagamente
  # parecido; ~0,82 = mesmo assunto). 0.6 deixava passar todos os capítulos.
  similaridade_min: 0.78
