[project]
name = "roadmap-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12.9"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 140
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# Estilo existente do projeto: linhas longas em testes e `l` como variável de laço curto.
ignore = ["E501", "E741"]

[tool.mypy]
python_version = "3.12"
